name: Publish

# Fires at the channel's posting windows. The stage re-checks cadence itself, so an
# extra manual run can never push the channel past its daily limit.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without publishing anything
        type: boolean
        default: false

concurrency:
  group: content-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE }}
      PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Publish next ready video
        run: npm run publish

      - name: Commit publish results
        if: always()
        run: |
          git config user.name  "content-engine[bot]"
          git config user.email "content-engine[bot]@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then
            echo "Nothing published."
            exit 0
          fi
          git commit -m "chore(queue): publish $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
